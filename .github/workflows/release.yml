name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match package.json version' }
      - name: Test update logic and coverage
        run: npm run test:coverage
      - name: Validate HTML and CSP
        run: node scripts/prepare-html.cjs
      - name: Build installer
        run: npm run build:win
      - name: Generate SHA-256 manifest
        run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: FuPanTai-Windows-x64
          path: |
            dist/FuPanTai-Setup-*-x64.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo $env:GITHUB_REPOSITORY --title "复盘台 $tag" --generate-notes }
          gh release upload $tag dist/FuPanTai-Setup-*-x64.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
